name: Staging Deployment Pipeline

on:
  push:
    branches:
      - staging

env:
  REGISTRY: ghcr.io

jobs:
  validate-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore src/backend/FinWallet.slnx
        
      - name: Build backend
        run: dotnet build src/backend/FinWallet.slnx --no-restore --configuration Release
        
      - name: Test backend
        run: dotnet test src/backend/FinWallet.slnx --no-build --configuration Release --verbosity normal

  validate-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/finwallet-web
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/finwallet-web/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build

  build-and-push-images:
    name: Build & Push Images
    needs: [validate-backend, validate-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    strategy:
      matrix:
        include:
          - image: finwallet-api
            context: src/backend
            dockerfile: src/backend/FinWallet.Api/Dockerfile
          - image: finwallet-mock-bank-core
            context: src/backend
            dockerfile: src/backend/FinWallet.MockBankCore.Worker/Dockerfile
          - image: finwallet-frontend
            context: src/frontend/finwallet-web
            dockerfile: src/frontend/finwallet-web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=staging
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
