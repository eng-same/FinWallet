services:
  finwallet-postgres:
    image: postgres:16-alpine
    container_name: finwallet-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finwallet-network

  finwallet-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: finwallet-rabbitmq-staging
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finwallet-network

  finwallet-api:
    image: ${DOCKER_REGISTRY}/${DOCKER_REPOSITORY}/finwallet-api:${IMAGE_TAG:-staging}
    container_name: finwallet-api-staging
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ConnectionStrings__DefaultConnection=Host=finwallet-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMq__Host=finwallet-rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-FinWallet.Api}
      - Jwt__Audience=${JWT_AUDIENCE:-FinWallet.Frontend}
      - Jwt__AccessTokenExpirationMinutes=120
    ports:
      - "8081:8080"
    depends_on:
      finwallet-postgres:
        condition: service_healthy
      finwallet-rabbitmq:
        condition: service_healthy
    networks:
      - finwallet-network

  finwallet-mock-bank-core:
    image: ${DOCKER_REGISTRY}/${DOCKER_REPOSITORY}/finwallet-mock-bank-core:${IMAGE_TAG:-staging}
    container_name: finwallet-mock-bank-core-staging
    restart: unless-stopped
    environment:
      - DOTNET_ENVIRONMENT=Staging
      - RabbitMq__Host=finwallet-rabbitmq
      - RabbitMq__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMq__Password=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      finwallet-rabbitmq:
        condition: service_healthy
    networks:
      - finwallet-network

  finwallet-frontend:
    image: ${DOCKER_REGISTRY}/${DOCKER_REPOSITORY}/finwallet-frontend:${IMAGE_TAG:-staging}
    container_name: finwallet-frontend-staging
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      - finwallet-api
    networks:
      - finwallet-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  finwallet-network:
    driver: bridge
